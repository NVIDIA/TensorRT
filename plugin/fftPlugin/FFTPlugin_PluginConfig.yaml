---
name: FFTPlugin
interface: "IPluginV3"
versions:
  "1":
    inputs:
      - input
    supported_input_types:
      - combination1:
          input: float32
      - combination2:
          input: float16
      - combination3:
          input: bfloat16
    # Golden-IO covers fp32 only. torch.fft has no reduced-precision kernel, so an fp16/bf16
    # golden is an fp32 reference rounded to the output dtype and frozen — cross-architecture
    # cuFFT drift then risks flakiness against a fixed target. The plugin's fp16/bf16 numerics
    # are instead verified against a live torch.fft reference by test_dft_importer_e2e[fp16/bf16].
    configs:
      config1:
        input_types:
          input: float32
        attribute_options:
          inverse:
            - 0
          onesided:
            - 0
          ndims:
            - 1
      config2:
        input_types:
          input: float32
        attribute_options:
          inverse:
            - 1
          onesided:
            - 0
          ndims:
            - 1
      config3:
        input_types:
          input: float32
        attribute_options:
          inverse:
            - 0
          onesided:
            - 1
          ndims:
            - 1
      config4:
        input_types:
          input: float32
        attribute_options:
          inverse:
            - 1
          onesided:
            - 1
          ndims:
            - 1
      config5:
        input_types:
          input: float32
        attribute_options:
          inverse:
            - 0
          onesided:
            - 0
          ndims:
            - 2
      config6:
        input_types:
          input: float32
        attribute_options:
          inverse:
            - 0
          onesided:
            - 0
          ndims:
            - 3
    outputs:
      - output
    attributes:
      - inverse
      - onesided
      - ndims
    attribute_types:
      inverse: int32
      onesided: int32
      ndims: int32
    attribute_length:
      inverse: 1
      onesided: 1
      ndims: 1
    attribute_options:
      inverse:
        - 0
        - 1
      onesided:
        - 0
        - 1
      ndims:
        - 1
        - 2
        - 3
    attributes_required:
      - ndims
    golden_io_path: "plugin/FFTPlugin_PluginGoldenIO.json"
    abs_tol: 1e-2
    rel_tol: 1e-2
...
